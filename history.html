<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Cotações - Tatuá</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .history-container {
            margin-top: 30px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-hash {
            font-family: monospace;
            color: #808080;
            font-weight: bold;
        }

        .history-date {
            color: #888;
            font-size: 14px;
        }

        .history-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .history-detail {
            background: rgba(0, 217, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
        }

        .history-detail label {
            display: block;
            font-size: 12px;
            color: #808080;
            margin-bottom: 5px;
        }

        .history-detail span {
            font-size: 14px;
            color: #ffffff;
        }

        .history-prices {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .history-price {
            flex: 1;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
        }

        .history-price h4 {
            color: #808080;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .history-price .price {
            font-size: 24px;
            font-weight: bold;
            color: #b0b0b0;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .back-button {
            margin-top: 20px;
        }

        .clear-history {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.5);
        }

        .clear-history:hover {
            background: rgba(255, 0, 0, 0.4);
            border-color: rgba(255, 0, 0, 0.7);
        }

        .period-filter {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .period-filter input[type="date"] {
            flex: 1;
            min-width: 120px;
        }

        .period-filter span {
            color: #808080;
        }

        .period-filter .btn {
            flex: none;
            margin-bottom: 0;
            padding: 10px 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="tatua.png" alt="Tatuá Logo" class="logo">
        </header>

        <div class="card">
            <h1>Histórico de Cotações</h1>
            <p>Visualize todas as cotações realizadas neste dispositivo.</p>

            <div class="form-group">
                <label>Filtrar por período:</label>
                <div class="period-filter">
                    <input type="date" id="period-start" name="period-start">
                    <span>até</span>
                    <input type="date" id="period-end" name="period-end">
                    <button id="filter-period" class="btn btn-secondary">Filtrar</button>
                    <button id="clear-filter" class="btn btn-outline">Limpar Filtro</button>
                </div>
            </div>

            <button id="download-csv" class="btn btn-primary">Download CSV (Período Selecionado)</button>
            <button id="send-reminder" class="btn btn-whatsapp" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-color: #764ba2;">📧 Enviar Lembretes (60 dias)</button>

            <div id="history-container" class="history-container">
                <!-- History items will be inserted here -->
            </div>

            <button id="clear-history" class="btn btn-secondary clear-history">Limpar Histórico</button>
            <button id="back-to-main" class="btn btn-primary back-button">Voltar ao Início</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Format currency
        function formatCurrency(value) {
            return value.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });
        }

        // Format date from ISO to Brazilian format
        function formatDateBr(isoDate, includeTime = false) {
            if (!isoDate) return '-';
            const date = new Date(isoDate);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            if (includeTime) {
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${day}/${month}/${year} ${hours}:${minutes}`;
            }
            return `${day}/${month}/${year}`;
        }

        // Fetch history from Supabase
        async function fetchHistoryFromSupabase() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/contatos?order=data_cotacao.desc`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Supabase API error: ${response.status}`);
                }

                const data = await response.json();
                return data.map(row => ({
                    hash: row.codigo_cotacao,
                    quoteDate: formatDateBr(row.data_cotacao, true),
                    eventDate: formatDateBr(row.data_evento),
                    city: row.cidade,
                    clientName: row.nome || null,
                    clientPhone: row.telefone || null,
                    actionTime: row.action_time,
                    timeOption: row.time_option,
                    pricePB: row.price_pb || 0,
                    priceColorido: row.price_colorido || 0,
                    // Store ISO dates for filtering
                    _dataEventoIso: row.data_evento
                }));
            } catch (error) {
                console.error('Error fetching history from Supabase:', error);
                return null;
            }
        }

        // Filter history by period
        function filterHistory() {
            const startDate = document.getElementById('period-start').value;
            const endDate = document.getElementById('period-end').value;

            if (!startDate && !endDate) {
                loadHistory();
                return;
            }

            const container = document.getElementById('history-container');
            const history = window.currentHistory || [];

            let filteredHistory = history;

            if (startDate) {
                filteredHistory = filteredHistory.filter(quote => {
                    return quote._dataEventoIso && quote._dataEventoIso >= startDate;
                });
            }

            if (endDate) {
                filteredHistory = filteredHistory.filter(quote => {
                    return quote._dataEventoIso && quote._dataEventoIso <= endDate;
                });
            }

            if (filteredHistory.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 64px; margin-bottom: 20px; opacity: 0.3;">🔍</div>
                        <h3>Nenhuma cotação encontrada</h3>
                        <p>Não há cotações no período selecionado.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredHistory.map(quote => `
                <div class="history-item">
                    <div class="history-header">
                        <span class="history-hash">${quote.hash}</span>
                        <span class="history-date">${quote.quoteDate}</span>
                    </div>

                    <div class="history-details">
                        <div class="history-detail">
                            <label>Data do Evento</label>
                            <span>${quote.eventDate}</span>
                        </div>
                        <div class="history-detail">
                            <label>Cidade</label>
                            <span>${quote.city}</span>
                        </div>
                        <div class="history-detail">
                            <label>Nome</label>
                            <span>${quote.clientName || '-'}</span>
                        </div>
                        <div class="history-detail">
                            <label>Telefone</label>
                            <span>${quote.clientPhone || '-'}</span>
                        </div>
                        <div class="history-detail">
                            <label>Tempo de Ação</label>
                            <span>${quote.actionTime} horas</span>
                        </div>
                        <div class="history-detail">
                            <label>Tipo de Cálculo</label>
                            <span>${quote.timeOption === 'guests' ? 'Convidados' : 'Direto'}</span>
                        </div>
                    </div>

                    <div class="history-prices">
                        <div class="history-price">
                            <h4>PRETO E BRANCO</h4>
                            <div class="price">${formatCurrency(quote.pricePB)}</div>
                        </div>
                        <div class="history-price">
                            <h4>COLORIDO</h4>
                            <div class="price">${formatCurrency(quote.priceColorido)}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Store filtered for CSV export
            window.filteredHistory = filteredHistory;
        }

        // Clear filter
        async function clearFilter() {
            document.getElementById('period-start').value = '';
            document.getElementById('period-end').value = '';
            window.filteredHistory = null;
            await loadHistory();
        }

        // Download filtered history as CSV
        function downloadCSV() {
            const startDate = document.getElementById('period-start').value;
            const endDate = document.getElementById('period-end').value;

            // Use filtered history if available, otherwise use all history
            let history = window.filteredHistory || window.currentHistory || [];

            if (history.length === 0) {
                alert('Não há cotações para exportar.');
                return;
            }

            // Create CSV content
            const headers = ['Código', 'Data da Cotação', 'Nome', 'Telefone', 'Data do Evento', 'Cidade', 'Tempo de Ação (horas)', 'Tipo de Cálculo', 'Preço PB', 'Preço Colorido'];

            const csvContent = [
                headers.join(','),
                ...history.map(quote => [
                    quote.hash,
                    `"${quote.quoteDate}"`,
                    `"${quote.clientName || ''}"`,
                    `"${quote.clientPhone || ''}"`,
                    quote.eventDate,
                    `"${quote.city}"`,
                    quote.actionTime,
                    quote.timeOption === 'guests' ? 'Convidados' : 'Direto',
                    quote.pricePB.toFixed(2),
                    quote.priceColorido.toFixed(2)
                ].join(','))
            ].join('\n');

            // Create download link
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');

            const dateRange = (startDate || 'inicio') + '_' + (endDate || 'fim');
            link.href = URL.createObjectURL(blob);
            link.download = `cotacoes_${dateRange}.csv`;
            link.style.display = 'none';

            document.body.appendChild(link);
            link.click();

            // Clean up
            setTimeout(() => {
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            }, 100);
        }

        // Load and display history
        async function loadHistory() {
            const container = document.getElementById('history-container');

            const history = await fetchHistoryFromSupabase();

            if (!history) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 64px; margin-bottom: 20px; opacity: 0.3;">⚠️</div>
                        <h3>Erro ao carregar histórico</h3>
                        <p>Não foi possível conectar ao banco de dados. Tente novamente mais tarde.</p>
                    </div>
                `;
                return;
            }

            if (history.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 64px; margin-bottom: 20px; opacity: 0.3;">📋</div>
                        <h3>Nenhuma cotação encontrada</h3>
                        <p>Não há cotações registradas no sistema.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = history.map(quote => `
                <div class="history-item">
                    <div class="history-header">
                        <span class="history-hash">${quote.hash}</span>
                        <span class="history-date">${quote.quoteDate}</span>
                    </div>

                    <div class="history-details">
                        <div class="history-detail">
                            <label>Data do Evento</label>
                            <span>${quote.eventDate}</span>
                        </div>
                        <div class="history-detail">
                            <label>Cidade</label>
                            <span>${quote.city}</span>
                        </div>
                        <div class="history-detail">
                            <label>Nome</label>
                            <span>${quote.clientName || '-'}</span>
                        </div>
                        <div class="history-detail">
                            <label>Telefone</label>
                            <span>${quote.clientPhone || '-'}</span>
                        </div>
                        <div class="history-detail">
                            <label>Tempo de Ação</label>
                            <span>${quote.actionTime} horas</span>
                        </div>
                        <div class="history-detail">
                            <label>Tipo de Cálculo</label>
                            <span>${quote.timeOption === 'guests' ? 'Convidados' : 'Direto'}</span>
                        </div>
                    </div>

                    <div class="history-prices">
                        <div class="history-price">
                            <h4>PRETO E BRANCO</h4>
                            <div class="price">${formatCurrency(quote.pricePB)}</div>
                        </div>
                        <div class="history-price">
                            <h4>COLORIDO</h4>
                            <div class="price">${formatCurrency(quote.priceColorido)}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Store for filtering and CSV
            window.currentHistory = history;
        }

        // Clear history
        async function clearHistory() {
            if (confirm('Tem certeza que deseja recarregar o histórico?')) {
                await loadHistory();
            }
        }

        // Go back to main page
        function goToMainPage() {
            // Use window.location.assign instead of href to avoid security issues
            window.location.assign('index.html');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            // Wrap in try-catch to handle potential security issues with file:// URLs
            try {
                await loadHistory();

                document.getElementById('clear-history').addEventListener('click', clearHistory);
                document.getElementById('back-to-main').addEventListener('click', goToMainPage);
                document.getElementById('filter-period').addEventListener('click', filterHistory);
                document.getElementById('clear-filter').addEventListener('click', clearFilter);
                document.getElementById('download-csv').addEventListener('click', downloadCSV);

                // Event listener para o botão de enviar lembretes
                const reminderBtn = document.getElementById('send-reminder');
                if (reminderBtn) {
                    reminderBtn.addEventListener('click', async function() {
                        // Verificar se a API Key do Resend foi configurada
                        if (typeof RESEND_API_KEY === 'undefined' || RESEND_API_KEY === 're_YOUR_API_KEY_HERE') {
                            alert('⚠️ Atualização necessária!\n\nPara enviar lembretes por email, você precisa:\n\n1. Obter uma API Key em https://resend.com/api-keys\n2. Editar o arquivo app.js\n3. Substituir "re_YOUR_API_KEY_HERE" pela sua API Key\n\nApós configurar, o botão funcionará corretamente.');
                            return;
                        }

                        // Confirmar antes de enviar
                        if (confirm('Deseja buscar e enviar lembretes para cotações com 60 dias para o evento?')) {
                            // Mostrar estado de carregamento
                            const originalText = reminderBtn.textContent;
                            reminderBtn.textContent = '⏳ Processando...';
                            reminderBtn.disabled = true;

                            try {
                                await executarLembreteCotacoes();
                            } finally {
                                // Restaurar estado do botão
                                reminderBtn.textContent = originalText;
                                reminderBtn.disabled = false;
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('Error initializing history page:', error);
                alert('Erro ao carregar o histórico. Tente abrir o arquivo através de um servidor local.');
            }
        });
    </script>
</body>
</html>
